[package]
name = "simple_rest_client"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
mock = ["mockall"]

[dependencies]
async-trait = "0.1"
http-body-util = "0.1"
hyper = {version = "1.6.0", features = ["client"]}
hyper-util = { version = "0.1.11", features = ["full"] }
log = { path = "../log" }
mockall = { version = "0.13.1", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "1"
tokio = {version = "1.44.1", features = ["full"]}
urlencoding = "2.1.3"

[dev-dependencies]
fake = "4.3.0"
tokio-test = "0.4"
log = { path = "../log", features = ["mock"]}
