# http routing section
http:
  middlewares:
    authentik:
      forwardAuth:
        address: http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version
  routers:
    to_backend:
      rule: "Host(`localhost`)"
      middlewares:
        - authentik
      service: blue_backend
    default-router-auth:
      rule: "Host(`app.company`) && PathPrefix(`/outpost.goauthentik.io/`)"
      priority: 15
      service: authentik

  services:
    authentik:
      loadBalancer:
        servers:
          - url: http://authentik-server:9000/outpost.goauthentik.io

    blue_backend:
      loadBalancer:
        servers:
        - url: "http://blue:3000"

    green_backend:
      loadBalancer:
        servers:
        - url: "http://green:4000"
