[package]
name = "credentials"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
colored = "3"
file_system = { path = "../file_system" }
futures = "0.3.31"
log = { path = "../log" }
mockall = { version = "0.13.1" }
nix = { version = "0.30.1", features = ["signal", "user"] }
rand = "0.9.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
subtle = "2.6.1"
thiserror = "1"
tokio = { version = "1.44.1", features = ["full"] }
tokio-serde = { version = "0.9.0", features = ["json"] }
tokio-util = { version = "0.7.15", features = ["codec"] }
users = "=0.11"
uuid = { version = "1.17.0", features = ["v7"] }

[dev-dependencies]
log = { path = "../log", features = ["mock"] }
