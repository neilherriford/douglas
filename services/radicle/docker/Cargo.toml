[package]
name = "docker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = {version = "1.44.1", features = ["full"]}
hyper = {version = "1.6.0", features = ["client"]}
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }
hyperlocal = "0.9.1"
serde = {version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
simple_rest_client = { path = "../simple_rest_client" }
file_system = { path = "../file_system" }
async-trait = "0.1"
thiserror = "1"
percent-encoding = "2"
mockall = { version = "0.13.1"}
regex = "1"
once_cell = "1.21.3"
log = { path = "../log" }

[dev-dependencies]
simple_rest_client = { path = "../simple_rest_client", features = ["mock"] }
