[package]
name = "bract"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = { workspace = true }
blueprint = { workspace = true }
colored = { workspace = true }
config = { workspace = true }
credentials = { workspace = true }
docker = { workspace = true }
file_system = { workspace = true }
futures = "0.3.31"
log = { workspace = true }
mockall = { workspace = true }
os = { workspace = true }
percent-encoding = "2"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = "2.6.1"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-serde = { version = "0.9.0", features = ["json"] }
tokio-util = { version = "0.7.15", features = ["codec"] }
uuid = { workspace = true }
utils = { workspace = true }

[dev-dependencies]
log = { workspace = true, features = ["mock"] }
file_system = { workspace = true, features = ["mock"] }
os = { workspace = true, features = ["mock"] }
credentials = { workspace = true, features = ["mock"] }
