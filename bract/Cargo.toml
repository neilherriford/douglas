[package]
name = "bract"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
blueprint = { path = "../blueprint" }
colored = "3"
config = { path = "../config" }
credentials = { path = "../credentials" }
file_system = { path = "../file_system" }
futures = "0.3.31"
log = { path = "../log" }
mockall = { version = "0.13.1" }
os = { path = "../os" }
percent-encoding = "2"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sled = "0.34.7"
subtle = "2.6.1"
thiserror = "1"
tokio = { version = "1.44.1", features = ["full"] }
tokio-serde = { version = "0.9.0", features = ["json"] }
tokio-util = { version = "0.7.15", features = ["codec"] }
uuid = { version = "1.17.0", features = ["v7"] }
utils = { path = "../utils" }


[dev-dependencies]
log = { path = "../log", features = ["mock"] }
file_system = { path = "../file_system", features = ["mock"] }
os = { path = "../os", features = ["mock"] }
credentials = { path = "../credentials", features = ["mock"] }
