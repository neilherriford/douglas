[package]
name = "douglas"
version = "0.0.1"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
blueprint = { workspace = true }
bract = { workspace = true }
clap = { version = "4.5.32", features = ["derive"] }
colored = { workspace = true }
command-fds = "0.3.3"
config = { workspace = true }
credentials = { workspace = true }
crossterm = "0.29.0"
daemonize = "0.5.0"
docker = { workspace = true }
file_system = { workspace = true }
humantime = { workspace = true }
log = { workspace = true }
mockall = { workspace = true }
nix = { workspace = true }
openbao = { workspace = true }
os = { workspace = true }
os_pipe = "1.2.3"
ratatui = "0.30.0"
serde = { workspace = true }
serde_json = { workspace = true }
simple_rest_client = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
utils = { workspace = true }

[dev-dependencies]
file_system = { workspace = true, features = ["mock"] }

[workspace]
members = [
    "simple_rest_client",
    "docker",
    "credentials",
    "log",
    "file_system",
    "os",
    "bract", "config", "utils", "openbao", "blueprint", "service_library", "application_definition_repository", "resin",
]

[workspace.dependencies]
# External
async-trait = "0.1"
colored = "3"
http-body-util = "0.1"
humantime = "2.3.0"
hyper = { version = "1.6.0", features = ["client"] }
hyper-util = { version = "0.1.11", features = ["full"] }
mockall = "0.13.1"
nix = { version = "0.30.1", features = ["fs"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "1"
tokio = { version = "1.44.1", features = ["full"] }
toml = "1.1.2"
users = "=0.11"
uuid = { version = "1.23.1", features = ["v7"] }
# Internal
application_definition_repository = { path = "./application_definition_repository" }
blueprint = { path = "./blueprint" }
bract = { path = "./bract" }
config = { path = "./config" }
credentials = { path = "./credentials" }
docker = { path = "./docker" }
file_system = { path = "./file_system" }
log = { path = "./log" }
openbao = { path = "./openbao" }
os = { path = "./os" }
simple_rest_client = { path = "./simple_rest_client" }
utils = { path = "./utils" }

[patch.crates-io]
users = { git = "https://github.com/neilherriford/rust-users", branch = "fix/macos_misaligned-pointer-dereference" }

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
