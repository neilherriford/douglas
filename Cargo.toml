[package]
name = "douglas"
version = "0.0.1"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
bract = { path = "./bract" }
chrono = "=0.4.41"
clap = { version = "4.5.32", features = ["derive"] }
colored = "3"
config = { path = "./config" }
credentials = { path = "./credentials" }
daemonize = "0.5.0"
docker = { path = "./docker" }
file_system = { path = "./file_system" }
log = { path = "./log" }
mockall = { version = "0.13.1" }
os = { path = "./os" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
simple_rest_client = { path = "./simple_rest_client" }
utils = { path = "./utils" }
thiserror = "1"
tokio = { version = "1.44.1", features = ["full"] }

[dev-dependencies]
file_system = { path = "./file_system", features = ["mock"]}

[workspace]
members = [
    "simple_rest_client",
    "docker",
    "credentials",
    "log",
    "file_system",
    "os",
    "bract", "config", "utils",
]

[patch.crates-io]
users = { git = "https://github.com/neilherriford/rust-users", branch = "fix/macos_misaligned-pointer-dereference" }

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
